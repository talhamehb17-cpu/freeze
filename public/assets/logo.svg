<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tahseen Jaber Cold Storage & Logistics — brand mark.

  STATUS: ORIGINAL PLACEHOLDER, CLIENT-REPLACEABLE.
  No brand logo was supplied with the project brief and none could be verified
  from public sources, so this monogram was drawn for the build using the
  specified brand palette. To swap in the real artwork, replace this file
  (keeping the 48x48 viewBox and the filename) and re-export a matching
  favicon; the React mark in src/components/brand/Logo.tsx should be updated to
  match so the two never diverge.

  Palette: Frost White #F4FAFF · Ice Blue #7DD3FC · Electric Cyan #22D3EE
           Deep Navy #081426
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Tahseen Jaber Cold Storage and Logistics">
  <defs>
    <linearGradient id="tjLogoCrystal" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4FAFF"/>
      <stop offset="38%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="tjLogoCell" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="tjLogoCore" cx="24" cy="24" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cold glow -->
  <circle cx="24" cy="24" r="15" fill="url(#tjLogoCore)"/>

  <!-- hexagonal cold chamber -->
  <polygon points="24 3.4,41.8 13.7,41.8 34.3,24 44.6,6.2 34.3,6.2 13.7"
           stroke="url(#tjLogoCell)" stroke-width="1.6" fill="#081426" fill-opacity="0.85" stroke-linejoin="round"/>
  <polygon points="24 7.6,38.1 15.8,38.1 32.2,24 40.4,9.9 32.2,9.9 15.8"
           stroke="#7DD3FC" stroke-opacity="0.22" stroke-width="0.9" fill="none" stroke-linejoin="round"/>

  <!-- six-arm ice crystal, recessed behind the monogram -->
  <g stroke="url(#tjLogoCrystal)" stroke-width="1.1" stroke-linecap="round" opacity="0.42">
    <line x1="12.6" y1="24" x2="35.4" y2="24"/>
    <line x1="18.3" y1="14.1" x2="29.7" y2="33.9"/>
    <line x1="29.7" y1="14.1" x2="18.3" y2="33.9"/>
    <path stroke-width="0.9" d="M31.2 24 L33.9 21.8 M31.2 24 L33.9 26.2"/>
    <path stroke-width="0.9" d="M16.8 24 L14.1 21.8 M16.8 24 L14.1 26.2"/>
    <path stroke-width="0.9" d="M27.4 17.5 L27.1 14.1 M27.4 17.5 L30.6 16.4"/>
    <path stroke-width="0.9" d="M20.6 30.5 L20.9 33.9 M20.6 30.5 L17.4 31.6"/>
    <path stroke-width="0.9" d="M20.6 17.5 L20.9 14.1 M20.6 17.5 L17.4 16.4"/>
    <path stroke-width="0.9" d="M27.4 30.5 L27.1 33.9 M27.4 30.5 L30.6 31.6"/>
  </g>

  <!-- TJ monogram, drawn as geometry so it never depends on a webfont -->
  <g stroke="url(#tjLogoCrystal)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- T -->
    <path d="M14.6 17.6 H26.2"/>
    <path d="M20.4 17.6 V33.2"/>
    <!-- J -->
    <path d="M33.6 17.6 V28.1 C33.6 31.5 31.5 33.3 28.9 33.3 C26.8 33.3 25.3 32.2 24.9 30.5"/>
  </g>

  <!-- frost node at the crystal core, above the monogram -->
  <circle cx="24" cy="24" r="1.5" fill="#F4FAFF" fill-opacity="0.9"/>
</svg>
